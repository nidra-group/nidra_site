<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- La n de Nidra: el sol naciente del que nace el horizonte.

       Es el escalón más chico del sistema de marca. El logotipo completo no
       entra en 16 píxeles —«idra» se vuelve una mancha—, así que acá va la
       letra sola con el arranque del horizonte, que se corta contra el borde
       a propósito: sugiere que sigue.

       Los colores están escritos a mano porque un favicon no lee el CSS del
       sitio. Al cambiar la paleta en `app/globals.css` hay que actualizarlos
       acá también. -->
