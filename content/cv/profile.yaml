# Fuente única de verdad del perfil profesional (FR-043, FR-047).
#
# La página del subdominio, la vista de impresión y cada documento descargable
# derivan de este archivo. No hay copias.
#
# Los campos de texto llevan `es` y `en` en el mismo nodo. Esto hace que la
# paridad entre idiomas sea estructural: no se puede agregar una experiencia en
# español sin abrir el hueco en inglés, porque es el mismo nodo del árbol.
#
# La versión del currículum NO se declara acá: se deriva del hash y la fecha del
# último commit que tocó este archivo. El historial de git es el versionado.

