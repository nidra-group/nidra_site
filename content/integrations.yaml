# Catálogo de integraciones (Anexo A de la especificación).
#
# `proven: true` = experiencia demostrable del equipo. Se ordena primero dentro
# de su categoría.
#
# El esquema NO tiene campo de texto libre por integración, y es a propósito:
# sin lugar donde escribir una afirmación sobre el dominio de una plataforma,
# no se puede exagerar por descuido. La diferencia entre probada y no probada
# se expresa solo en el orden.

categories:
  - id: ai-models
    order: 1
    name:
      es: Modelos y plataformas de IA
      en: AI models and platforms
    items:
      - { name: OpenAI, proven: true }
      - { name: Anthropic, proven: false }
