# Catálogo de integraciones (Anexo A de la especificación).
#
# `proven: true` = experiencia demostrable del equipo. Se ordena primero dentro
# de su categoría.
#
# El esquema NO tiene campo de texto libre por integración, y es a propósito:
# sin lugar donde escribir una afirmación sobre el dominio de una plataforma,
# no se puede exagerar por descuido. La diferencia entre probada y no probada
# se expresa solo en el orden.
#
# ── QUÉ VA ACÁ Y QUÉ VA EN technologies.yaml ─────────────────────────────────
# Son dos listas que responden preguntas distintas y no conviene mezclarlas:
#
#   technologies.yaml  → «con qué construyo». Es una afirmación de experiencia:
#                        la portada dice «trabajo sobre estas plataformas».
#   este archivo       → «con qué me puedo conectar». La página aclara que la
#                        lista es representativa y no completa.
#
# Los sistemas de negocio del cliente —Tiendanube, ARCA, Tango, Andreani— van
# acá y no allá. Nombrarlos en la portada volvería falsa una frase que ya está
# publicada.
#
# ── SOBRE `icon` ─────────────────────────────────────────────────────────────
# Identificador del logotipo en Simple Icons, opcional. Sin él la herramienta
# se muestra solo con su nombre, que es lo que pasa con casi todas las
# argentinas: Tiendanube, ARCA, Tango, Xubio, Andreani, Fudo y las demás no
# están en el paquete. Dibujarlas a mano sería reproducir marcas registradas
# sin licencia, que es justo lo que acá se evita.
#
# OpenAI, AWS y Slack tampoco tienen: las tres pidieron ser retiradas.
#
# Y hay un tercer motivo para no poner `icon` aunque exista: WooCommerce,
# Cal.com, Odoo y Zoho tienen marca DENOMINATIVA —el nombre escrito, no un
# símbolo—. Dentro del recuadro de 18 px quedan de tres o cuatro píxeles de
# alto: una mancha al lado del nombre, que se lee peor que el nombre solo.
# Antes de agregar un `icon`, mirá si la marca es un símbolo.
#
# Después de tocar este archivo:  pnpm build:icons

categories:
