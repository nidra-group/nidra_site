# Sección "Tecnologías con las que trabajo" (FR-027).
#
# `relationship` es un enum cerrado: `technology` | `vendor`.
#
# NO existe el valor `partner`, y no es un olvido. Declarar una alianza
# comercial inexistente exigiría cambiar el esquema en lib/content/schemas.ts,
# no solo este archivo. Cuando exista un acuerdo verificable, se agrega el
# valor junto con el campo que documente su origen.
#
# ── SOBRE `icon` ─────────────────────────────────────────────────────────────
# `icon` es el identificador del logotipo en Simple Icons. Es OPCIONAL: sin él
# la tecnología se muestra como marca denominativa en texto y funciona igual.
#
# Dos marcas van SIN icono a propósito, y no por descuido:
#
#   OpenAI y Amazon Web Services fueron RETIRADAS de Simple Icons a pedido de
#   esas empresas. Son las dos que más celan el uso de su marca. Reproducir sus
#   logotipos sin licencia es exactamente el riesgo que ese retiro señala, así
#   que se nombran en texto —uso nominativo, que es legítimo— y no se dibujan.
#
# Todos los logotipos se muestran en UN SOLO COLOR, nunca en su color
# corporativo. Además de resolver la «sopa de logos», el monocromo evita la
# lectura de «socio oficial» que produce un logotipo a color.
#
# `category` agrupa la grilla: ai | data | cloud | dev.

# ── Inteligencia artificial ──────────────────────────────────────────────────
