<svg xmlns="http://www.w3.org/2000/svg" viewBox="-46 -40 670 526" role="img" aria-label="Nidra">
  <title>Nidra</title>
<!-- ═══ LOGOTIPO DE NIDRA ═══

     La n es el sol naciente y de su pie nace el horizonte, que corre hacia
     la derecha mientras «idra» se apoya encima. Una banda horizontal de 31
     unidades atraviesa el logotipo ENTERO —la letra, la barra y la palabra—
     a la altura y = 192..223: no es una ranura en una letra, es un plano que
     cruza todo. Eso es lo que la hace leer como decisión y no como defecto.

     Trazado original construido en Figma sobre Unbounded 700.

     ── SÍMBOLO ABREVIADO, UNA TINTA ──
     -->
